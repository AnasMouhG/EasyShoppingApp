<style>

.in{width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}.in:focus{outline:2px solid var(--g)}

h2{margin:0}.sec{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}.sec a{color:var(--gt);font-size:13px;font-weight:700}

64px">🛒</div><p>Votre panier est vide</p><button class="btn" style="width:auto" data-a="tab" data-v="browse">Commencer mes courses</button></div>`)}

function ordersPg(){$('#p-orders').innerHTML=`<h2 class="f text-2xl font-extrabold mb-3">Suivi des commandes</h2>`+(orders.length?orders.slice().reverse().map(o=>{const s=stage(o);return`<div class="card"><div class="flex justify-between"><b>${o.id}</b><b style="color:var(--gt)">${fmt(o.total)}</b></div><small style="color:var(--mut)">${o.stores} · ${o.n} articles · ${o.pay}</small><div style="margin-top:12px">${STG.map((x,i)=>`<div class="flex items-center gap-3" style="opacity:${i<=s?1:.4};padding:4px 0"><span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:${i<=s?'var(--g)':'var(--ln)'}">${i<s||s==3?'✓':i+1}</span><span style="font-weight:${i==s?700:500}">${x}${i==s&&s<3?' …':''}</span></div>`).join('')}</div>${s==3?'':'<small style="color:var(--mut)">Livraison estimée : '+o.eta+' min</small>'}</div>`}).join(''):`<div style="text-align:center;padding:60px 0;color:var(--mut)"><div style="font-size:64px">📦</div><p>Aucune commande pour le moment</p></div>`)}
function trk(){const o=orders[orders.length-1],t=$('#trk');if(!o||stage(o)==3&&Date.now()-o.t>60000)return t.classList.remove('on');const s=stage(o);t.classList.add('on');t.innerHTML=`<div class="flex justify-between text-sm"><b>📦 ${o.id}</b><span>${STG[s]}</span></div><div class="dots">${STG.map((x,i)=>`<i class="${i<=s?'d':''}"></i>`).join('')}</div>`}
function topBar(){const s=S()[st];$('#l1').textContent=W[wil]+' · Livraison à domicile';$('#l2').textContent=s[2]+' '+s[0]+' ▾';$('#l3').textContent=eta(st)+' min';document.querySelectorAll('[data-bd]').forEach(b=>{b.textContent=cnt();b.style.display=cnt()?'':'none'})}

function goTab(t){tab=t;document.querySelectorAll('.pg').forEach(x=>x.classList.toggle('on',x.id=='p-'+t));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v==t));closeAll();draw();scrollTo(0,0)}

let nowSheet='';
function locSheet(){nowSheet='loc';sheet(`<h2 class="f text-xl font-extrabold mb-2">Où livrer ?</h2><label class="lb">Wilaya</label><select class="in" id="ws">${W.map((w,i)=>`<option value="${i}" ${i==wil?'selected':''}>${String(i+1).padStart(2,'0')} - ${w}</option>`).join('')}</select><div class="card" style="background:var(--bg)"><small>🛵 <b>${fmt(tier().fee)}</b> de base · gratuite dès <b>${fmt(tier().free)}</b> · ~<b>${tier().eta}</b> min</small></div><label class="lb">Magasin ${wil==15?'':'(données de démonstration)'}</label><div style="margin-top:6px">${S().map((s,i)=>`<button class="row ${i==st?'on':''}" data-a="store" data-v="${i}"><span style="font-size:24px">${s[2]}</span><span style="flex:1"><b style="font-size:14px">${s[0]}</b><br><small style="color:var(--mut)">${s[1]} · ${fmt(fee(i))} · ${eta(i)} min</small></span>${i==st?'✓':''}</button>`).join('')}</div>`)}
function cmpSheet(id){nowSheet='cmp';const p=PM[id],R=S().map((s,i)=>({s,i,x:info(i,id)})).sort((a,b)=>a.x.fin-b.x.fin),ch=R.find(r=>r.x.stk>0);
 sheet(`<h2 class="f text-lg font-extrabold">${p[6]} ${p[2]}</h2><small style="color:var(--mut)">${p[4]} · Comparaison en temps réel</small><div style="margin-top:10px">${R.map(r=>`<div class="row ${r===ch?'on':''}"><span style="flex:1"><b style="font-size:13px">${r.s[0]}</b>${r===ch?' <u style="background:var(--g);color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;text-decoration:none">Moins cher</u>':''}<br><small style="color:${r.x.stk?'var(--gt)':'var(--r)'}">${r.x.stk?'En stock ('+r.x.stk+')':'Rupture'}</small></span><b>${fmt(r.x.fin)}</b>${r.x.stk?`<button class="add" data-a="addx" data-id="${id}" data-s="${r.i}">+</button>`:''}</div>`).join('')}</div>`)}
function pdSheet(id){const p=PM[id],i=info(st,id);nowSheet='pd';sheet(`<div style="height:170px;border-radius:20px;background:${C[p[1]][3]};display:grid;place-items:center;font-size:84px;position:relative;overflow:hidden">${p[6]}${img(p)}</div><h2 class="f text-xl font-extrabold mt-3">${p[2]}</h2><div dir="rtl" style="color:var(--mut)">${p[3]}</div><p style="color:var(--mut);margin:6px 0">${p[4]} · ${C[p[1]][1]}</p><div class="flex items-center gap-2 mb-3"><b class="f text-2xl" style="color:var(--gt)">${fmt(i.fin)}</b>${i.fin<i.b?`<span class="old">${fmt(i.b)}</span>`:''}${p[7].includes('l')?'<span class="chip on">🇩🇿 Local</span>':''}${p[7].includes('g')?'<span class="chip">🌾 Sans gluten</span>':''}</div><button class="btn" data-a="add" data-id="${id}" ${i.stk?'':'disabled'}>${i.stk?'Ajouter au panier':'Épuisé'}</button><button class="btn sec" style="margin-top:8px" data-a="cmp" data-id="${id}">⚖️ Comparer les prix</button>`)}

function impGo(){const T=$('#il').value.split(/[,\n;،]+/).map(x=>x.trim()).filter(Boolean);let ok=0,miss=[];T.forEach(t=>{const n=norm(t),c=P.filter(p=>norm([p[2],p[3],p[4],p[8]].join(' ')).includes(n)&&info(st,p[0]).stk>0).sort((a,b)=>info(st,a[0]).fin-info(st,b[0]).fin)[0];if(c){const kk=key(st,c[0]);cart[kk]=Math.min(info(st,c[0]).stk,(cart[kk]||0)+1);ok++}else miss.push(t)});closeAll();draw();toast(ok+' article(s) ajouté(s)'+(miss.length?' · introuvable : '+miss.join(', '):''),!ok)}

function place(){const t=totals(),SS=S(),id='DZ-'+(100000+Math.floor(Math.random()*899999)),e=Math.max(...t.G.map(g=>eta(g.s)));

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(e.target.id=='ov')return closeAll();if(!b)return;const a=b.dataset.a,id=+b.dataset.id,kk=b.dataset.k,v=b.dataset.v;

 else if(a=='dec'){if(--cart[kk]<=0)delete cart[kk];draw()}else if(a=='inc'){const[s,i]=kk.split(':').map(Number);add(i,s)}else if(a=='rm'){delete cart[kk];closeAll();draw()}

 else if(a=='co2'){const x=i=>$('#'+i).value.trim();if(x('fn').length<3)return toast('Entrez votre nom complet',1);if(!/^0[567]\d{8}$/.test(x('fp').replace(/\s/g,'')))return toast('Numéro mobile algérien invalide (05/06/07…)',1);if(x('fa').length<6)return toast('Entrez votre adresse',1);coSheet(2)}
 else if(a=='pay'){pay=v;coSheet(2)}else if(a=='place')place()});
document.addEventListener('change',e=>{if(e.target.id=='ws'){const n=+e.target.value;if(n!=wil){if(cnt()){cart={};toast('Panier vidé : nouvelle wilaya',1)}wil=n;st=0;locSheet();draw()}}});
