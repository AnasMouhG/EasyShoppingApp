name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: easyshoppingdz/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        working-directory: easyshoppingdz
        run: npm ci

      - name: Build web app and sync Capacitor
        working-directory: easyshoppingdz
        run: npm run build && npx cap sync android

      - name: Build Android APK
        working-directory: easyshoppingdz/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyShoppingDZ-APK
          path: easyshoppingdz/android/app/build/outputs/apk/debug/app-debug.apk
